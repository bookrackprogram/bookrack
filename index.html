const cBy=id=>courses.find(c=>c.id===id),aBy=id=>assignments.filter(a=>a.courseId===id),gBy=id=>grades.filter(g=>g.assignmentId===id);function timeM(t){let[a,b]=t.split(':').map(Number);return a*60+b}function addM(t,n){let x=timeM(t)+n;return String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0')}function timeText(t){let[a,b]=t.split(':').map(Number);return new Date(2000,0,1,a,b).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}function average(cid){let total=0,w=0;aBy(cid).forEach(a=>{let g=gBy(a.id).at(-1),weight=Number(a.weightEarned??a.weight)||0;if(g){total+=Number(g.mark)*weight;w+=weight}});return w?total/w:null}function overall(){let x=courses.map(c=>average(c.id)).filter(v=>v!=null);return x.length?x.reduce((a,b)=>a+b,0)/x.length:null}function snapshot(){history.push(JSON.stringify(state()));if(history.length>20)history.shift()}function undo(){let s=history.pop();if(!s)return;applyState(JSON.parse(s));save();render()}function go(v){location.hash='#'+v}function openModal(t,h){$('modalTitle').textContent=t;$('modalBody').innerHTML=h;$('modalBg').classList.add('open')}function closeModal(){$('modalBg').classList.remove('open')}function render(){let v=location.hash.slice(1)||'dashboard';$('nav').innerHTML=['dashboard','courses','calendar','grades','study'].map(x=>`<a href="#${x}" class="${v===x?'active':''}">${x[0].toUpperCase()+x.slice(1)}</a>`).join('');({dashboard,courses:coursePage,calendar:calendarPage,grades:gradesPage,study:studyPage,settings:settingsPage}[v]||dashboard)()}addEventListener('hashchange',render);addEventListener('beforeunload',saveLocal);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')save()});
function greeting(){let h=new Date().getHours(),name=profile?.name||'Student';if(h>=23||h<=4)return[Math.random()<.5?`Welcome to the Dark Side, ${name}`:'Procrastination Kills','🦉'];if(h<=9)return[Math.random()<.5?'Good Morning, Good Morning, Good Morning':`Rise and Shine, ${name}`,'☕️'];if(h<=17)return[Math.random()<.5?'Working Hard or Hardly Working':'The struggle is almost over','☀️'];return[Math.random()<.5?`Good Evening, ${name}`:'Hard Work Pays Off','🤓']}function trackers(){let n=new Date(),t=new Date(n.getFullYear(),n.getMonth(),n.getDate()),w=new Date(t),o=new Date(t);w.setDate(w.getDate()+7);o.setDate(o.getDate()-14);let td=0,tw=0,od=0;assignments.filter(a=>!a.done).forEach(a=>{let d=new Date(a.due);if(isNaN(d))return;let x=new Date(d.getFullYear(),d.getMonth(),d.getDate());if(+x===+t)td++;else if(x>t&&x<=w)tw++;else if(x<t&&x>=o)od++});return{td,tw,od}}function dashboard(){let t=trackers(),n=new Date(),g=greeting(),c1=t.td===0?'var(--green)':t.td===1?'var(--yellow)':'var(--red)',c2=t.tw===0?'var(--green)':t.tw>5?'var(--red)':'var(--yellow)',c3=t.od===0?'var(--green)':'var(--red)';$('app').innerHTML=`<h2>Dashboard</h2><section class="panel welcome"><div class="welcomeLeft"><div class="welcomeEmoji">${g[1]}</div><div><div class="welcomeTitle">${esc(g[0])}</div><div class="muted">${n.toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'})}</div></div></div><div class="trackers"><div class="tracker"><span class="trackerLabel">Due Today</span><span class="trackerValue" style="color:${c1}">${t.td}</span></div><div class="tracker"><span class="trackerLabel">Due This Week</span><span class="trackerValue" style="color:${c2}">${t.tw}</span></div><div class="tracker"><span class="trackerLabel">Overdue</span><span class="trackerValue" style="color:${c3}">${t.od}</span></div></div></section><div class="grid3"><section class="widget"><h3>Today’s Schedule</h3>${todaySessions()}</section><section class="widget"><h3>Upcoming Assignments</h3 function coursePage(){$('app').innerHTML=`<h2>Courses</h2><section class="panel"><form id="courseForm" class="row"><div class="field"><label>Course code</label><input name="code" required></div><div class="field"><label>Course name</label><input name="name" required></div><div class="field"><label>Instructor</label><input name="instructor"></div><div class="field"><label>Color</label><input name="color" type="color" value="#7f5af0"></div><button>Add Course</button></form></section><section class="panel"><div class="courseGrid">${courses.map(c=>`<article class="courseCard" style="border-color:${c.color||'var(--border)'}" onclick="courseDetails('${c.id}')"><b>${esc(c.icon||subjectEmoji(c.name))} ${esc(c.code)}</b><div class="courseName">${esc(c.name)}</div><div class="small muted">${esc(c.instructor||'')}</div></article>`).join('')||'<div class="empty">No courses yet.</div>'}</div></section>`;$('courseForm').onsubmit=e=>{e.preventDefault();snapshot();let f=new FormData(e.target),name=f.get('name').trim();courses.push({id:uid(),code:f.get('code').trim(),name,instructor:f.get('instructor').trim(),color:f.get('color'),icon:subjectEmoji(name),goal:null});save();coursePage()}}window.courseDetails=id=>{let c=cBy(id);openModal(`${c.icon||subjectEmoji(c.name)} ${c.code} — ${c.name}`,`<section class="panel"><div class="assignmentLine"><div><div class="muted small">Current average</div><div class="big">${average(id)?.toFixed(1)||'—'}%</div></div><div><button onclick="editCourse('${id}')">Edit Course</button></div></div></section><section class="panel"><h3>Assignments & Grades</h3>${aBy(id).map(a=>{let g=gBy(a.id).at(-1);return `<div class="assignmentItem"><div class="assignmentLine"><div><b>${esc(a.title)}</b><div class="muted small">${a.type} · total ${a.weight}% · available ${a.weightEarned??a.weight}% · ${a.done?'Completed':'Open'}</div></div><div class="assignmentGrade">${g?g.mark+'%':'—'}</div></div><div class="row" style="margin-top:6px"><button class="secondary" onclick="editAssignment('${a.id}')">Edit</button><button class="secondary" onclick="copyAssignment('${a.id}')">Copy</button><button class="secondary" onclick="editGrade('${a.id}')">${g?'Edit Grade':'Add Grade'}</button></div></div>`}).join('')||'<div class="empty">No assignments.</div>'}<button style="margin-top:10px" onclick="addAssignment('${id}')">Add Assignment</button></section><section class="panel"><h3>Class Sessions</h3>${sessions.filter(s=>s.courseId===id).map(s=>`<div class="assignmentItem">${DAYS[s.day]} · ${timeText(s.start)}–${timeText(s.end)} · ${esc(s.location||'')} <button class="secondary" onclick="editSessionFromDetails('${s.id}')">Edit</button></div>`).join('')||'<div class="empty">No sessions.</div>'}<button style="margin-top:10px" onclick="addSession('${id}')">Add Session</button></section>`) };window.editCourse=id=>{let c=cBy(id);openModal('Edit Course',`<form id="editCourse" class="grid2"><div><label>Code</label><input name="code" value="${esc(c.code)}"></div><div><label>Name</label><input name="name" value="${esc(c.name)}"></div><div><label>Course Icon</label><input name="icon" value="${esc(c.icon||subjectEmoji(c.name))}"></div><div><label>Class Goal (%)</label><input type="number" step=".1" name="goal" value="${c.goal??''}"></div><div><label>Instructor</label><input name="instructor" value="${esc(c.instructor||'')}"></div><div><label>Color</label><input type="color" name="color" value="${c.color||'#7f5af0'}"></div><button>Save</button></form>`);$('editCourse').onsubmit=e=>{e.preventDefault();snapshot();let f=new FormData(e.target);Object.assign(c,{code:f.get('code'),name:f.get('name'),icon:f.get('icon')||subjectEmoji(f.get('name')),goal:f.get('goal')?+f.get('goal'):null,instructor:f.get('instructor'),color:f.get('color')});save();closeModal();render()}};
window.addAssignment=cid=>assignmentEditor({id:null,courseId:cid,title:'',type:'Assignment',due:'',weight:10,weightEarned:10,notes:'',done:false});window.editAssignment=id=>assignmentEditor(assignments.find(a=>a.id===id));window.copyAssignment=id=>{let a=assignments.find(a=>a.id===id);if(!a)return;assignmentEditor({...a,id:null,title:a.title+' (Copy)',due:'',done:false})};function assignmentEditor(a){openModal(a.id?'Edit Assignment':'Add Assignment',`<form id="assignmentForm" class="grid2"><div><label>Course</label><select name="courseId">${courses.map(c=>`<option value="${c.id}" ${c.id===a.courseId?'selected':''}>${esc(c.code)}</option>`).join('')}</select></div><div><label>Title</label><input name="title" value="${esc(a.title)}" required></div><div><label>Type</label><select name="type">${['Assignment','Homework','Attendance','Quiz','Lab','Midterm','Project','Final','Other'].map(x=>`<option ${x===a.type?'selected':''}>${x}</option>`).join('')}</select></div><div><label>Due</label><input type="datetime-local" name="due" value="${String(a.due||'').slice(0,16)}" required></div><div><label>Total weight (%)</label><input type="number" step=".1" name="weight" value="${a.weight}"></div><div><label>Weight available so far (%)</label><input type="number" step=".1" name="weightEarned" value="${a.weightEarned??a.weight}"></div><div style="grid-column:1/-1"><label>Notes</label><textarea name="notes">${esc(a.notes||'')}</textarea></div><div style="grid-column:1/-1"><label class="completeControl"><input name="done" type="checkbox" ${a.done?'checked':''}><span>Mark as Complete</span></label></div><button>${a.id?'Save':'Add Assignment'}</button></form>`);$('assignmentForm').onsubmit=e=>{e.preventDefault();snapshot();let f=new FormData(e.target),d={courseId:f.get('courseId'),title:f.get('title'),type:f.get('type'),due:f.get('due'),weight:+f.get('weight'),weightEarned:+f.get('weightEarned'),notes:f.get('notes'),done:f.has('done')};if(a.id)Object.assign(a,d);else assignments.push({id:uid(),...d});save();closeModal();render()}}window.editGrade=aid=>{let a=assignments.find(a=>a.id===aid),g=gBy(aid).at(-1);openModal(g?'Edit Grade':'Add Grade',`<form id="gradeForm"><label>${esc(a.title)} — Percentage</label><input name="mark" type="number" min="0" max="100" step=".1" required value="${g?.mark??''}"><div style="margin-top:10px"><button>Save Grade</button></div></form>`);$('gradeForm').onsubmit=e=>{e.preventDefault();snapshot();let mark=+new FormData(e.target).get('mark');if(g)g.mark=mark;else grades.push({id:uid(),assignmentId:aid,mark});save();closeModal();render()}};
function calendarPage(){$('app').innerHTML=`<h2>Calendar</h2><section class="panel"><div class="calendarToolbar"><div class="row"><button class="secondary" onclick="moveCalendar(-1)">←</button><button class="secondary" onclick="todayCalendar()">Today</button><button class="secondary" onclick="moveCalendar(1)">→</button><b id="calendarTitle"></b></div><div class="row"><button class="secondary" onclick="setCalendarMode('week')">Week</button><button class="secondary" onclick="setCalendarMode('month')">Month</button></div></div><p class="dragHint">Click an empty time in the calendar to add a session. Drag a class to move it; its duration stays the same.</p><div id="calendarContent"></div></section>`;calMode==='week'?renderWeek():renderMonth()}window.moveCalendar=n=>{calDate.setDate(calDate.getDate()+(calMode==='week'?n*7:n*30));calendarPage()};window.todayCalendar=()=>{calDate=new Date();calendarPage()};window.setCalendarMode=m=>{calMode=m;calendarPage()};function sundayOf(d){let x=new Date(d);x.setDate(x.getDate()-x.getDay());x.setHours(0,0,0,0);return x}function mToTop(m){return m-CAL_START}function topToM(y){return Math.max(CAL_START,Math.min(CAL_END-5,CAL_START+Math.round(y/5)*5))}function mToTime(m){return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}function attachPointerDrag(el,s){el.addEventListener('pointerdown',e=>{if(e.button!==0)return;e.preventDefault();e.stopPropagation();let r=el.getBoundingClientRect(),ghost=el.cloneNode(true);ghost.className='dragGhost';ghost.style.width=r.width+'px';ghost.style.height=r.height+'px';ghost.style.background=el.style.background;ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';document.body.append(ghost);pointerDrag={session:s,duration:Math.max(5,timeM(s.end)-timeM(s.start)),offsetY:e.clientY-r.top,element:el,ghost,pointerId:e.pointerId,moved:false};el.classList.add('dragging');document.body.classList.add('dragging-calendar');document.addEventListener('pointermove',movePointerDrag);document.addEventListener('pointerup',endPointerDrag,{once:true});document.addEventListener('pointercancel',cancelPointerDrag,{once:true})})}function movePointerDrag(e){if(!pointerDrag||e.pointerId!==pointerDrag.pointerId)return;pointerDrag.moved=true;pointerDrag.ghost.style.left=e.clientX+'px';pointerDrag.ghost.style.top=e.clientY+'px'}function endPointerDrag(e){if(!pointerDrag||e.pointerId!==pointerDrag.pointerId)return;finishPointerDrag(e.clientX,e.clientY)}function cancelPointerDrag(){if(!pointerDrag)return;pointerDrag.element.classList.remove('dragging');pointerDrag.ghost?.remove();pointerDrag=null;document.body.classList.remove('dragging-calendar');document.removeEventListener('pointermove',movePointerDrag)}function finishPointerDrag(x,y){let d=pointerDrag;if(!d)return;document.removeEventListener('pointermove',movePointerDrag);document.body.classList.remove('dragging-calendar');d.element.classList.remove('dragging');d.ghost?.remove();let col=document.elementFromPoint(x,y)?.closest('.dayColumn');if(!col){pointerDrag=null;return}let r=col.getBoundingClientRect(),top=Math.max(0,Math.min(CAL_HEIGHT-1,y-r.top-d.offsetY)),start=topToM(top);snapshot();d.session.day=+col.dataset.day;d.session.start=mToTime(start);d.session.end=mToTime(Math.min(CAL_END,start+d.duration));save();pointerDrag=null;calendarPage()}function renderWeek(){let start=sundayOf(calDate),end=new Date(start);end.setDate(end.getDate()+6);$('calendarTitle').textContent=`${start.toLocaleDateString(undefined,{month:'short',day:'numeric'})} – ${end.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}`;let scroll=document.createElement('div');scroll.className='weekScroll';let grid=document.createElement('div');grid.className='weekGrid';grid.append(document.createElement('div'));for(let d=0;d<7;d++){let x=new Date(start);x.setDate(start.getDate()+d);let h=document.createElement('div');h.className='dayHead';h.innerHTML=`${DAYS[d]}<br>${x.getMonth()+1}/${x.getDate()}`;grid.append(h)}let axis=document.createElement('div');axis.className='timeAxis';for(let h=8;h<=22;h++){let l=document.createElement('div');l.className='timeLabel';l.textContent=timeText(String(h).padStart(2,'0')+':00');axis.append(l)}grid.append(axis);let cols=[];for(let d=0;d<7;d++){let col=document.createElement('div');col.className='dayColumn';col.dataset.day=d;let surface=document.createElement('div');surface.className='dropSurface';surface.onclick=e=>{if(e.target!==surface||pointerDrag)return;let r=surface.getBoundingClientRect();addSessionFromCalendar(d,mToTime(topToM(e.clientY-r.top)))};col.append(surface);cols.push(col);grid.append(col)}sessions.forEach(s=>{let st=timeM(s.start),en=timeM(s.end),col=cols[+s.day];if(!col||en<=CAL_START||st>=CAL_END)return;let c=cBy(s.courseId),e=document.createElement('div');e.className='calendarEvent';e.style.top=Math.max(0,mToTop(st))+'px';e.style.height=Math.max(14,mToTop(en)-mToTop(st))+'px';e.style.background=`linear-gradient(180deg,${c?.color||'#7f5af0'},${c?.color||'#7f5af0'}cc)`;e.innerHTML=`<b>${esc(c?.icon||subjectEmoji(c?.name))} ${esc(c?.code||'Class')}</b><small>${timeText(s.start)}–${timeText(s.end)}</small><small>${esc(s.location||'')}</small><small>${esc(c?.instructor||'')}</small>`;e.onclick=x=>{if(pointerDrag?.moved)return;x.stopPropagation();editSession(s.id)};attachPointerDrag(e,s);col.append(e)});scroll.append(grid);$('calendarContent').append(scroll)}function renderMonth(){let y=calDate.getFullYear(),m=calDate.getMonth();$('calendarTitle').textContent=new Date(y,m,1).toLocaleDateString(undefined,{month:'long',year:'numeric'});let grid=document.createElement('div');grid.className='monthGrid';DAYS.forEach(d=>{let h=document.createElement('div');h.className='monthHead';h.textContent=d;grid.append(h)});let first=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate();for(let i=0;i<first;i++)grid.append(document.createElement('div'));for(let day=1;day<=last;day++){let cell=document.createElement('div');cell.className='monthCell';cell.innerHTML=`<b>${day}</b>`;let dow=new Date(y,m,day).getDay();sessions.filter(s=>+s.day===dow).slice(0,3).forEach(s=>{let c=cBy(s.courseId),e=document.createElement('div');e.className='chip';e.style.background=c?.color||'#7f5af0';e.textContent=`${c?.code||'Class'} ${timeText(s.start)}`;e.onclick=()=>editSession(s.id);cell.append(e)});grid.append(cell)}$('calendarContent').append(grid)}function addSessionFromCalendar(day,start){if(!courses.length){alert('Add a course first.');return}sessionEditor({id:null,courseId:courses[0].id,day,start,end:addM(start,60),location:'',notes:''})}window.addSession=cid=>sessionEditor({id:null,courseId:cid,day:0,start:'09:00',end:'10:00',location:'',notes:''});window.editSession=id=>sessionEditor(sessions.find(s=>s.id===id));window.editSessionFromDetails=id=>{closeModal();go('calendar');setTimeout(()=>editSession(id),60)};function sessionEditor(s){openModal(s.id?'Edit Session':'Add Session',`<form id="sessionForm" class="grid2"><div><label>Course</label><select name="courseId">${courses.map(c=>`<option value="${c.id}" ${c.id===s.courseId?'selected':''}>${esc(c.code)}</option>`).join('')}</select></div><div><label>Day</label><select name="day">${DAYS.map((d,i)=>`<option value="${i}" ${i===+s.day?'selected':''}>${d}</option>`).join('')}</select></div><div><label>Start</label><input type="time" name="start" value="${s.start}"></div><div><label>End</label><input type="time" name="end" value="${s.end}"></div><div><label>Location</label><input name="location" value="${esc(s.location||'')}"></div><div><label>Notes</label><input name="notes" value="${esc(s.notes||'')}"></div><button>${s.id?'Save':'Add Session'}</button></form>`);$('sessionForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),d={courseId:f.get('courseId'),day:+f.get('day'),start:f.get('start'),end:f.get('end'),location:f.get('location'),notes:f.get('notes')};if(timeM(d.end)<=timeM(d.start)){alert('End time must be after start time.');return}snapshot();if(s.id)Object.assign(s,d);else sessions.push({id:uid(),...d});save();closeModal();calendarPage()}}
function gradesPage(){let value=overall(),pct=Math.max(0,Math.min(100,value??0));$('app').innerHTML=`<h2>Grades</h2><section class="gauge"><div class="gaugeValue">${value===null?'—':pct.toFixed(0)+'%'}</div><div class="gaugeLabel">Overall Average</div><div class="gaugeBar"><div class="gaugeFill" style="width:${pct}%"></div><div class="arrow" style="left:${pct}%"></div></div><div class="marks"><span>0</span><span>25</span><span>50</span><span>75</span><span>100</span></div></section><section class="panel"><div class="gradeGrid">${courses.map(c=>{let x=average(c.id);return `<article class="gradeCard" onclick="courseDetails('${c.id}')" style="border-color:${c.color||'var(--border)'}"><b>${esc(c.icon||subjectEmoji(c.name))} ${esc(c.code)}</b><div class="big">${x?.toFixed(1)||'—'}% ${gradeEmoji(x,c.goal)}</div></article>`}).join('')||'<div class="empty">Add courses to see grades.</div>'}</div></section><section class="panel"><h3>Grade Calculator</h3>${gradeCalculator()}</section>`}function gradeCalculator(){if(!courses.length)return'<div class="empty">Add a course and assignments first.</div>';let c=courses[0],as=aBy(c.id);return `<div class="grid2"><div><label>Course</label><select id="calcCourse" onchange="refreshCalculator()">${courses.map(x=>`<option value="${x.id}">${esc(x.code)} — ${esc(x.name)}</option>`).join('')}</select></div><div><label>Assignment</label><select id="calcAssignment">${as.map(a=>`<option value="${a.id}">${esc(a.title)} (${a.weight}%)</option>`).join('')}</select></div></div><div class="grid2" style="margin-top:10px"><div><label>Predicted grade (%)</label><input id="calcMark" type="number" value="85"></div><div><label>Target Grade</label><input id="calcGoal" type="number" placeholder="Uses class goal if blank"></div></div><div class="row" style="margin-top:10px"><button onclick="calculateProjection()">Project Grade</button><button class="secondary" onclick="calculateNeeded()">What Do I Need?</button></div><div id="calcResult"></div>`}window.refreshCalculator=()=>gradesPage();window.calculateProjection=()=>{let c=cBy($('calcCourse').value),a=assignments.find(x=>x.id===$('calcAssignment').value),mark=+$('calcMark').value,cur=average(c.id)??0;if(!a)return;$('calcResult').innerHTML=`<div class="calcResult"><div class="calcLine"><span>Current average</span><b>${cur.toFixed(1)}%</b></div><div class="calcLine"><span>Projected average</span><b>${((cur*(100-a.weight)+mark*a.weight)/100).toFixed(1)}%</b></div></div>`};window.calculateNeeded=()=>{let c=cBy($('calcCourse').value),goal=+$('calcGoal').value||c.goal||85,done=aBy(c.id).filter(a=>gBy(a.id).length),remaining=aBy(c.id).filter(a=>!gBy(a.id).length),earned=done.reduce((s,a)=>s+gBy(a.id).at(-1).mark*(a.weightEarned??a.weight),0),rw=remaining.reduce((s,a)=>s+(a.weightEarned??a.weight),0),need=rw?(goal*100-earned)/rw:0;$('calcResult').innerHTML=`<div class="calcResult"><div class="calcLine"><span>Target goal</span><b>${goal}%</b></div><div class="calcLine"><span>Average needed on remaining work</span><b>${need.toFixed(1)}%</b></div></div>`};
function studyPage(){let totals={};study.forEach(x=>{let k=x.courseId||'general';totals[k]=(totals[k]||0)+x.seconds});$('app').innerHTML=`<h2>Study</h2><div class="grid2"><section class="panel"><h3>Study Timer</h3><label>Course</label><select id="timerCourse"><option value="">General</option>${courses.map(c=>`<option value="${c.id}">${esc(c.code)} — ${esc(c.name)}</option>`).join('')}</select><div id="timerDisplay" class="timer">${formatDuration(timerSeconds)}</div><div class="row timerControls"><button id="startTimer">Start</button><button id="stopTimer" class="secondary" ${timerRunning?'':'disabled'}>Stop</button><button id="resetTimer" class="secondary">Reset</button></div></section><section class="panel"><h3>Study History</h3>${Object.keys(totals).length?Object.entries(totals).map(([id,secs])=>`<div class="assignmentItem"><b>${id==='general'?'General':esc(cBy(id)?.code||'Unknown Course')}</b><div class="muted small">${formatDuration(secs)}</div></div>`).join(''):'<div class="empty">No study time logged yet.</div>'}</section></div><section class="panel"><h3>Study Tasks</h3><form id="taskForm" class="row"><div class="field"><select name="courseId"><option value="">General</option>${courses.map(c=>`<option value="${c.id}">${esc(c.code)}</option>`).join('')}</select></div><div class="field"><input name="title" required placeholder="New study task"></div><button>Add Task</button></form><div style="margin-top:10px">${tasks.map(t=>`<div class="assignmentItem"><label><input type="checkbox" ${t.done?'checked':''} onchange="toggleTask('${t.id}',this.checked)"> ${esc(t.title)}</label></div>`).join('')||'<div class="empty">No tasks yet.</div>'}</div></section>`;$('startTimer').onclick=startTimer;$('stopTimer').onclick=stopTimer;$('resetTimer').onclick=resetTimer;$('taskForm').onsubmit=e=>{e.preventDefault();snapshot();let f=new FormData(e.target);tasks.push({id:uid(),courseId:f.get('courseId'),title:f.get('title'),done:false});save();studyPage()}}function formatDuration(s){s=Math.max(0,Math.floor(s));return[Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(x=>String(x).padStart(2,'0')).join(':')}function startTimer(){if(timerRunning)return;timerRunning=true;timerInterval=setInterval(()=>{timerSeconds++;let d=$('timerDisplay');if(d)d.textContent=formatDuration(timerSeconds)},1000);$('startTimer').disabled=true;$('stopTimer').disabled=false}function stopTimer(){if(!timerRunning)return;clearInterval(timerInterval);timerRunning=false;if(timerSeconds>0){snapshot();study.push({id:uid(),courseId:$('timerCourse').value||'',seconds:timerSeconds,date:new Date().toISOString()});save()}timerSeconds=0;studyPage()}function resetTimer(){clearInterval(timerInterval);timerRunning=false;timerSeconds=0;studyPage()}window.toggleTask=(id,done)=>{snapshot();tasks.find(t=>t.id===id).done=done;save();studyPage()};
function settingsPage(){let signed=cloudUser?`Signed in as <b>${esc(cloudUser.email)}</b>`:'Not signed in';let cls=cloudUser?'good':'warn';$('app').innerHTML=`<h2>Settings</h2><section class="panel"><h3>Cloud Account</h3><div class="cloudStatus ${cls}" id="cloudStatus">${signed}<br>${esc(cloudStatus)}</div>${cloudUser?`<div class="row" style="margin-top:10px"><button onclick="saveCloudNow()">Save to Cloud Now</button><button class="secondary" onclick="signOut()">Sign Out</button></div>`:`<form id="authForm" class="grid2" style="margin-top:12px"><div><label>Email</label><input id="authEmail" type="email" required placeholder="you@example.com"></div><div><label>Password</label><input id="authPassword" type="password" required minlength="6" placeholder="At least 6 characters"></div><button type="button" onclick="signUp()">Create Account</button><button type="button" class="secondary" onclick="signIn()">Sign In</button></form>`}</section><section class="panel"><h3>Profile</h3><form id="profileForm" class="grid2"><div><label>Name</label><input name="name" value="${esc(profile?.name||'')}"></div><div><label>University</label><input name="university" value="${esc(profile?.university||'')}"></div><div><label>What are you studying?</label><input name="studying" value="${esc(profile?.studying||'')}"></div><div><label>Theme color</label><input type="color" name="theme" value="${profile?.theme||'#7f5af0'}"></div><button>Save Profile</button></form></section><section class="panel"><h3>Import Data</h3><p class="muted small">Imports are saved locally immediately and uploaded to your signed-in Supabase account automatically.</p><div class="tip">💡 Upload all course syllabi to an AI LLM and ask it: “Search these syllabi for every class detail such as class sessions, instructors, location, important notes, assignments, weightings, due dates, etc., and combine all of them into a single JSON file.”</div><input id="importFile" type="file" accept="application/json,.json"><div style="margin-top:10px"><button onclick="importData()">Import Data</button></div></section><section class="panel"><h3>Export Data</h3><button onclick="exportData()">Download Data</button></section><section class="panel"><h3>History</h3><button onclick="undo()" ${history.length?'':'disabled'}>Undo Last Change</button></section><section class="panel"><h3>Report Bug</h3><a href="mailto:andrew_tilley@icloud.com?subject=Bookrack%20Bug%20Report"><button>Report Bug</button></a></section><section class="panel"><h3>Local Data</h3><button class="danger" onclick="clearAll()">Clear All Data</button></section>`;$('profileForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);profile={name:f.get('name'),university:f.get('university'),studying:f.get('studying'),theme:f.get('theme')};save();settingsPage()}}window.signUp=async()=>{let email=$('authEmail').value,password=$('authPassword').value;if(!email||password.length<6){alert('Enter an email and a password of at least 6 characters.');return}let{data,error}=await supabase.auth.signUp({email,password,options:{emailRedirectTo:window.location.origin}});if(error){alert('Account creation failed: '+error.message);return}if(data.user&&!data.session){alert('Account created. Check your email to confirm it, then sign in.')}else{cloudUser=data.user;await loadCloud();render()}};window.signIn=async()=>{let email=$('authEmail').value,password=$('authPassword').value;let{data,error}=await supabase.auth.signInWithPassword({email,password});if(error){alert('Sign-in failed: '+error.message);return}cloudUser=data.user;await loadCloud();render()};window.signOut=async()=>{await supabase.auth.signOut();cloudUser=null;cloudStatus='Signed out — saving locally';render()};window.saveCloudNow=async()=>{saveLocal();await saveCloud();settingsPage()};
window.exportData=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({...state(),exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}));a.download=`bookrack-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href)};window.importData=()=>{let file=$('importFile').files[0];if(!file){alert('Choose a JSON file first.');return}let r=new FileReader();r.onload=async()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.courses)||!d.courses.length)throw Error('Missing courses array');if(!confirm('Replace your current Bookrack data with this imported backup?'))return;snapshot();let norm=v=>String(v||'').trim().toLowerCase(),cm={},codes={},names={},am={},mon=d.dayFormat==='monday-first'||d.weekStartsOn==='monday';courses=[];sessions=[];assignments=[];grades=[];tasks=[];study=[];d.courses.forEach(o=>{let id=uid(),c={...o,id,code:o.code||o.courseCode||'Untitled Course',name:o.name||o.courseName||o.code||'Untitled Course',icon:o.icon||subjectEmoji(o.name||o.code),color:o.color||'#7f5af0',instructor:o.instructor||'',goal:o.goal??null};courses.push(c);if(o.id)cm[String(o.id)]=id;codes[norm(c.code)]=id;names[norm(c.name)]=id});let courseFor=o=>{let x=o.courseId||o.course_id||o.courseID;if(x&&cm[String(x)])return cm[String(x)];let c=norm(o.courseCode||o.course_code||o.course||'');if(c&&codes[c])return codes[c];return names[norm(o.courseName||o.course_name||'')]||null};let sc=0,ac=0,skip=0;(d.sessions||[]).forEach(o=>{let cid=courseFor(o);if(!cid){skip++;return}let day=Number(o.day??o.dayIndex??0);if(mon)day=(day+1)%7;sessions.push({...o,id:uid(),courseId:cid,day,start:o.start||o.startTime||'09:00',end:o.end||o.endTime||'10:00',location:o.location||'',notes:o.notes||''});sc++});(d.assignments||[]).forEach(o=>{let cid=courseFor(o);if(!cid){skip++;return}let id=uid();if(o.id)am[String(o.id)]=id;assignments.push({...o,id,courseId:cid,title:o.title||o.name||'Untitled Assignment',due:o.due||o.dueDate||'',weight:+(o.weight??o.totalWeight??0),weightEarned:+(o.weightEarned??o.availableWeight??o.weight??0),done:!!(o.done??o.completed),notes:o.notes||''});ac++});(d.grades||[]).forEach(o=>{let id=am[String(o.assignmentId||o.assignment_id)];if(id)grades.push({...o,id:uid(),assignmentId:id,mark:+(o.mark??o.grade??o.score??0)})});(d.tasks||[]).forEach(o=>tasks.push({...o,id:uid(),courseId:courseFor(o)||'',title:o.title||o.name||'Task',done:!!(o.done??o.completed)}));(d.study||[]).forEach(o=>study.push({...o,id:uid(),courseId:cm[o.courseId]||o.courseId||'',seconds:+(o.seconds||0)}));if(d.profile)profile=d.profile;if(!saveLocal())throw Error('Browser refused local save');if(cloudUser){let ok=await saveCloud();if(!ok)throw Error('Cloud save failed. Your imported data is still saved locally.')}alert(`Import complete and saved: ${courses.length} course(s), ${sc} session(s), ${ac} assignment(s).${skip?` ${skip} unmatched item(s) were skipped.`:''}`);settingsPage()}catch(e){alert('Could not import JSON: '+e.message)}};r.readAsText(file)};window.clearAll=async()=>{if(!confirm('Delete all local Bookrack data? This does not delete the cloud copy.'))return;courses=[];sessions=[];assignments=[];grades=[];tasks=[];study=[];profile=null;history=[];saveLocal();render()};
(async function start(){loadLocal();let{data:{user}}=await supabase.auth.getUser();if(user){cloudUser=user;await loadCloud()}render();supabase.auth.onAuthStateChange(async(event,session)=>{if(event==='SIGNED_IN'&&session?.user&&!cloudUser){cloudUser=session.user;await loadCloud();render()}if(event==='SIGNED_OUT'){cloudUser=null;cloudStatus='Signed out — saving locally';render()}})})();
</script></body></html>
